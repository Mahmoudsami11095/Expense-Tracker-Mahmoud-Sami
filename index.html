<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Budget App</title>
    <link href="./dist/output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl md:text-4xl font-bold text-indigo-600 mb-2">Expense Tracker</h1>
            <p class="text-gray-500">Manage your daily expenses efficiently</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Form Section -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-xl shadow-lg p-6 sticky top-8">
                    <h2 class="text-xl font-semibold mb-4 text-gray-700">Add New Expense</h2>
                    <form id="expense-form" class="space-y-4">
                        <div>
                            <label for="title" class="block text-sm font-medium text-gray-600 mb-1">Title</label>
                            <input type="text" id="title" placeholder="e.g. Grocery"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
                                required>
                        </div>

                        <div>
                            <label for="amount" class="block text-sm font-medium text-gray-600 mb-1">Amount</label>
                            <input type="number" id="amount" placeholder="0.00" min="0.01" step="0.01"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
                                required>
                        </div>

                        <div>
                            <label for="category" class="block text-sm font-medium text-gray-600 mb-1">Category</label>
                            <select id="category"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
                                <option value="Food">Food</option>
                                <option value="Transport">Transport</option>
                                <option value="Utilities">Utilities</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Health">Health</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div>
                            <label for="date" class="block text-sm font-medium text-gray-600 mb-1">Date</label>
                            <input type="date" id="date"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
                                required>
                        </div>

                        <button type="submit"
                            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md transform active:scale-95">
                            Add Expense
                        </button>
                    </form>
                </div>
            </div>

            <!-- List & Stats Section -->
            <div class="lg:col-span-2 space-y-6">
                <!-- Stats Cards -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl shadow-lg p-6 text-white">
                        <h3 class="text-sm font-medium opacity-90">Total Expenses</h3>
                        <p class="text-3xl font-bold mt-1" id="total-amount">$0.00</p>
                    </div>
                    <div class="bg-white rounded-xl shadow-lg p-6 border-l-4 border-yellow-400">
                        <h3 class="text-sm font-medium text-gray-500">Highest Expense</h3>
                        <p class="text-xl font-bold text-gray-800 mt-1 truncate" id="highest-expense-title">-</p>
                        <p class="text-sm text-gray-500" id="highest-expense-amount">$0.00</p>
                    </div>
                </div>

                <!-- Filter & List -->
                <div class="bg-white rounded-xl shadow-lg p-6">
                    <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
                        <h2 class="text-xl font-semibold text-gray-700">Recent Expenses</h2>
                        <div class="flex items-center gap-2">
                            <label for="filter-category" class="text-sm text-gray-600">Filter:</label>
                            <select id="filter-category"
                                class="px-3 py-1.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                                <option value="All">All Categories</option>
                                <option value="Food">Food</option>
                                <option value="Transport">Transport</option>
                                <option value="Utilities">Utilities</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Health">Health</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="text-gray-500 border-b border-gray-200">
                                    <th class="pb-3 font-medium">Title</th>
                                    <th class="pb-3 font-medium">Category</th>
                                    <th class="pb-3 font-medium">Date</th>
                                    <th class="pb-3 font-medium text-right">Amount</th>
                                    <th class="pb-3 font-medium text-center">Action</th>
                                </tr>
                            </thead>
                            <tbody id="expense-list" class="text-sm text-gray-700">
                                <!-- Expense items will be injected here -->
                                <tr class="border-b border-gray-100 hover:bg-gray-50 transition">
                                    <td class="py-3 px-1" colspan="5" class="text-center text-gray-400 py-8">No expenses
                                        added yet.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
